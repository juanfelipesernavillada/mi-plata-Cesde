<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1440" viewBox="0 0 1700 1440" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de clases UML — Sistema Bancario Mi Plata</title>
<desc id="desc">Diagrama único del modelo de dominio y los servicios de Mi Plata. La herencia se diferencia de las asociaciones entre cliente, productos y movimientos.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#100b15"/><stop offset="1" stop-color="#09070d"/></linearGradient>
 <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61213f"/><stop offset="1" stop-color="#3e1c4d"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb5077"/><stop offset="1" stop-color="#be45d8"/></linearGradient>
 <marker id="umlInheritanceArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 Z" fill="#100b15" stroke="#ec6bb0" stroke-width="1.4"/></marker>
 <marker id="umlDirectionArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#ec6bb0"/></marker>
 <style>
 text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#f8f1fa}
 .title{font-size:30px;font-weight:800;letter-spacing:-.7px}
 .subtitle{font-size:14px;fill:#c2acc8}
 .section{font-size:11px;font-weight:800;letter-spacing:2px;fill:#e99acb}
 .class-title{font-size:18px;font-weight:800}
 .stereo{font-size:11px;fill:#f7b9dc;font-style:italic}
 .field-title{font-size:10px;font-weight:800;letter-spacing:1.6px;fill:#d990c3}
 .item{font-size:12.5px;fill:#e1d1e5}
 .method{font-size:12.5px;fill:#f3a1c8}
 .relation{font-size:12px;font-weight:700;fill:#f6c4e2;paint-order:stroke;stroke:#100b15;stroke-width:4px;stroke-linejoin:round}
 .legend{font-size:12px;fill:#d0bdd7}
 .card{fill:#17101d;stroke:#c94c9b;stroke-width:1.4}
 .connector{fill:none;stroke:#ec6bb0;stroke-width:1.7}
 .dependency{fill:none;stroke:#976b9b;stroke-width:1.4;stroke-dasharray:6 6}
 </style>
</defs>
